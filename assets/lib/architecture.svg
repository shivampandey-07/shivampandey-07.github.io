<text x="34" y="230" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5B6FAE">UI THREAD  (worklets)</text>
<rect x="44" y="76" width="196" height="104" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="142.0" y="99" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">Your screen</text>
<text x="142.0" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">date state</text>
<text x="142.0" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">sections / events</text>
<text x="142.0" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">renderItem, renderEvent</text>
<rect x="320" y="76" width="246" height="104" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="443.0" y="99" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">CalendarProvider</text>
<text x="443.0" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">owns the committed date</text>
<text x="443.0" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">echo queue (last 8 emissions)</text>
<text x="443.0" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">publishes the shared store</text>
<rect x="646" y="76" width="210" height="104" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="751.0" y="99" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">buildRange(...)</text>
<text x="751.0" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">padded to whole weeks</text>
<text x="751.0" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">ymdByIndex built once</text>
