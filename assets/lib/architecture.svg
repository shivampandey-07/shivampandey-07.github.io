<text x="450.0" y="269" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">Shared values</text>
<text x="450.0" y="289" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">dayIndex  ·  move { seq, idx, origin }  ·  listDragSeq</text>
<text x="450.0" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">written and read by every scroll handler</text>
