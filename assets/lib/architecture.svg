<text x="277" y="166" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#6F6F6F">onDateChanged</text>
<line x1="640" y1="128" x2="572" y2="128" stroke="#6F6F6F" stroke-width="1.4" marker-end="url(#arg)"/>
