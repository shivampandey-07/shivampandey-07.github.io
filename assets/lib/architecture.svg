<text x="169.0" y="391" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">page = floor(idx / 7)</text>
<line x1="169" y1="328" x2="169" y2="342" stroke="#5B6FAE" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="318" y="348" width="250" height="54" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="443.0" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">AgendaList</text>
<text x="443.0" y="391" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">section index = idx</text>
<line x1="443" y1="328" x2="443" y2="342" stroke="#5B6FAE" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="592" y="348" width="250" height="54" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="717.0" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">TimelineList</text>
<text x="717.0" y="391" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">column = idx</text>
<line x1="717" y1="328" x2="717" y2="342" stroke="#5B6FAE" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M169,314 L169,328 L717,328 L717,314" fill="none" stroke="#5B6FAE" stroke-width="1.6"/>
<text x="450.0" y="434" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#1F1F1F">Each surface ignores the moves it produced itself — no latches, no timers, no changedItems bookkeeping.</text>
<text x="450.0" y="450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6F6F6F">The JS thread is told only at settle.</text>
</svg>