<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" role="img" aria-label="One date owner and one integer index space feeding three surfaces across the JS and UI threads">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6FAE"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F6F6F"/></marker>
</defs>
<rect width="900" height="464" rx="14" fill="#FAFAFA" stroke="#E4E4E4"/>
<text x="450.0" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">One date owner, one integer index space</text>
<rect x="16" y="44" width="868" height="152" rx="10" fill="#FFFFFF" stroke="#E4E4E4" stroke-dasharray="4 4"/>
