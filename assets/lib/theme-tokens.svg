<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" role="img" aria-label="The eleven colour tokens of react-native-agenda-kit in the light and dark themes">
<rect width="900" height="492" rx="14" fill="#FAFAFA" stroke="#E4E4E4"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Eleven colours. If it is not on this list, the kit does not draw it.</text>
<text x="24" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6F6F6F">lightTheme and darkTheme are exported; pass a partial over either with theme + themeBase.</text>
