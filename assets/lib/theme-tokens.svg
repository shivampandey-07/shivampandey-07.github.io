<text x="24" y="480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6F6F6F">Plus three font families — fonts.regular / medium / semiBold. Omitted means the platform default; the kit ships no fonts.</text>
